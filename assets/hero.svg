<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
<title id="t">Praveen Kumar, AI engineer</title>
<desc id="d">An animated architecture diagram: a request travels from a web app through an API to a Claude agent, which calls RAG on Qdrant, MCP tools and Postgres, and the response travels back.</desc>
<defs>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1A2540" stroke-width="1"/></pattern>
  <path id="cg" d="M653 140 H697"/><path id="go" d="M833 140 H887"/><path id="ov" d="M955 162 V230 H795 V298"/><path id="ol" d="M955 162 V298"/><path id="od" d="M955 162 V230 H1115 V298"/>
</defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;fill:#DCE3F0}
  @media (prefers-reduced-motion: reduce){.pkt{display:none}}
</style>
<rect width="1200" height="440" rx="16" fill="#101826"/>
<rect x="500" y="40" width="680" height="360" fill="url(#grid)" opacity=".9"/>
<text x="56" y="150" class="sans" font-size="46" font-weight="700" fill="#DCE3F0" letter-spacing="-1">Praveen Kumar</text>
<text x="56" y="196" class="sans" font-size="20" fill="#DCE3F0">AI engineer. I build LLM products</text>
<text x="56" y="224" class="sans" font-size="20" fill="#DCE3F0">end to end, agent to database.</text>
<text x="56" y="278" class="mono" fill="#8A97B0" style="fill:#8A97B0">agents, MCP servers, RAG</text>
<text x="56" y="302" class="mono" style="fill:#8A97B0">full stack and backend architecture</text>
<text x="56" y="326" class="mono" style="fill:#8A97B0">designed and shipped with Claude Code</text>
<g fill="none" stroke="#33425F" stroke-width="1.5"><use href="#cg"/><use href="#go"/><use href="#ov"/><use href="#ol"/><use href="#od"/></g>

  <g><rect x="517" y="118" width="136" height="44" rx="8" fill="#18233A" stroke="#33425F" stroke-width="1.5">
    <animate attributeName="stroke" dur="5s" repeatCount="indefinite"
